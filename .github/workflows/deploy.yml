name: Deploy IDFinder1

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VAR_github_repo: ericsonasamoah3/IDFinder-Automated
  TF_VAR_github_branch: master

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ADD THIS HERE
      - name: Debug GitHub OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f2 | tr '_-' '/+' | base64 -d 2>/dev/null || true)

          echo "$PAYLOAD" | jq '{
            iss,
            aud,
            sub,
            repository,
            repository_owner,
            ref,
            event_name,
            repository_id,
            repository_owner_id
          }'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform format check
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        env:
          TF_VAR_github_access_token: ${{ secrets.GH_ACCESS_TOKEN }}
          TF_VAR_ocr_api_key: ${{ secrets.OCR_API_KEY }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        env:
          TF_VAR_github_access_token: ${{ secrets.GH_ACCESS_TOKEN }}
          TF_VAR_ocr_api_key: ${{ secrets.OCR_API_KEY }}
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform outputs
        run: terraform output
