name: Deploy IDFinder1

on:
  push:
    branches: [master]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  TF_VAR_github_repo: ericsonasamoah3/IDFinder-Automated
  TF_VAR_github_branch: master

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # If "Configure AWS credentials" ever starts failing again, the usual
      # cause is the OIDC subject in terraform/iam.tf drifting from the claim
      # this repo actually issues (it uses a CUSTOMISED subject template --
      # see the comment on that condition). To read the real claim, add a step
      # here that curls $ACTIONS_ID_TOKEN_REQUEST_URL and base64-decodes the
      # JWT payload.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        env:
          TF_VAR_github_access_token: ${{ secrets.GH_ACCESS_TOKEN }}
          TF_VAR_ocr_api_key: ${{ secrets.OCR_API_KEY }}
          # Optional. Unset just means the billing alarm is created with
          # nobody subscribed to it -- the plan still succeeds.
          TF_VAR_billing_alert_email: ${{ secrets.BILLING_ALERT_EMAIL }}
        run: terraform plan -out=tfplan

      - name: Terraform apply
        env:
          TF_VAR_github_access_token: ${{ secrets.GH_ACCESS_TOKEN }}
          TF_VAR_ocr_api_key: ${{ secrets.OCR_API_KEY }}
          TF_VAR_billing_alert_email: ${{ secrets.BILLING_ALERT_EMAIL }}
        run: terraform apply -auto-approve tfplan

      - name: Show Terraform outputs
        run: terraform output
